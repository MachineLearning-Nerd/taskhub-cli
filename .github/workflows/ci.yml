# Formatting, lints, tests (including the contract snapshot, skill and shipped-docs checks) and a release build.
# Tests use synthetic tokens and local mock servers only; no secrets are available here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: The bundled skill and shell scripts are well formed
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/e2e.sh scripts/gen-docs.sh scripts/sync-contract.sh
          python3 -m py_compile scripts/bench.py scripts/e2e-delay-proxy.py
