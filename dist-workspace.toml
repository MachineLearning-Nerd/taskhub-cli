[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Static musl binaries for Linux, so no distribution's libraries are assumed
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# Where the shell installer puts the binary
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# Whether to install an updater program
install-updater = false
# Build attestations for every artifact
github-attestations = true
# The man page and completions ship in every archive (regenerate with scripts/gen-docs.sh)
include = ["dist-extra/taskhub.1", "dist-extra/completions/"]
# Pull requests only check that a plan can be made; releases run on version tags
pr-run-mode = "plan"

# Actions pinned to commits (resolved 2026-10-08 from their major tags)
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
